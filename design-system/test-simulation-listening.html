    <body
        class="bg-deep-space min-h-screen p-6 md:p-app-margin font-body-md text-body-md flex items-center justify-center"
    >
        <!-- Browser Card Mockup -->
        <main
            class="w-full h-full min-h-[800px] bg-background rounded-2xl md:rounded-[2rem] overflow-hidden flex flex-col relative shadow-2xl"
        >
            <!-- TopAppBar (Simulating Screen 6 Interface) -->
            <header
                class="bg-primary-container text-on-primary-container w-full z-[100] flex justify-between items-center px-8 py-4 rounded-b-xl shadow-md"
            >
                <div class="flex items-center gap-3">
                    <span
                        class="material-symbols-outlined text-white text-2xl"
                        data-icon="timer"
                        >timer</span
                    >
                    <h1
                        class="font-headline-md text-headline-md text-white font-bold"
                    >
                        Listening Section: Task 1
                    </h1>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="font-label-md text-label-md text-white hover:bg-surface-container-high/20 px-4 py-2 rounded-full transition-colors active:scale-95 duration-150"
                    >
                        Pause
                    </button>
                    <button
                        class="font-label-md text-label-md bg-secondary text-white px-6 py-2 rounded-full hover:bg-secondary/90 transition-colors shadow-sm active:scale-95 duration-150"
                    >
                        Submit Section
                    </button>
                </div>
            </header>
            <!-- Main Content Area: Split Panels -->
            <div
                class="flex-1 flex flex-col md:flex-row gap-8 p-8 overflow-y-auto"
            >
                <!-- Left Panel: Visual/Media -->
                <section
                    class="flex-1 bg-surface-container-low rounded-2xl flex flex-col relative overflow-hidden custom-shadow border border-surface-variant"
                >
                    <!-- Academic Illustration/Photo Placeholder -->
                    <div class="flex-1 relative w-full h-full min-h-[300px]">
                        <img
                            class="absolute inset-0 w-full h-full object-cover"
                            data-alt="A highly detailed and realistic illustration of a bustling archaeology site bathed in bright, warm sunlight. The scene is incredibly detailed, showing excavators meticulously uncovering ancient ruins, dusting off artifacts, and taking notes. The overall aesthetic is modern and educational, utilizing a soft-professional color palette with earthy tones and subtle pastel accents to maintain a modern SaaS education vibe. The mood is focused and academic."
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuArSzhIRyB1HDAYIbn99kePVU57O2X2160HbXWYr2znT0xpM7Gwpo5bSkJQoXb9V5-BjIqkzJ7HJsr4pPSfFpZTHIZ68EQtZxzdwY8Cq9iQd7dPPikIZoGEI8YC0kxsbOpa_NqGAOCO-DwSucvWxSJ_qDZjikIlmnUwQi7lS_bsqx7hMZG6YYIPyu20HmOh67tABJM5UKfUT4ql7qxxQRpUUBztvM9BcvRY5EspEH___GjME2o1Tsk"
                        />
                        <!-- Overlay to soften image if needed -->
                        <div class="absolute inset-0 bg-black/5"></div>
                    </div>
                    <!-- Sleek Audio Player Component -->
                    <div
                        class="bg-surface-white p-6 flex flex-col gap-4 border-t border-surface-variant shadow-sm z-10 relative"
                    >
                        <div
                            class="flex justify-between items-center text-text-heading font-label-md"
                        >
                            <span>0:45</span>
                            <span class="text-text-muted">3:20</span>
                        </div>
                        <!-- Progress Seek Bar -->
                        <div
                            class="relative w-full h-[6px] bg-track-neutral rounded-full cursor-pointer group"
                        >
                            <div
                                class="absolute top-0 left-0 h-full bg-secondary rounded-full"
                                style="width: 25%"
                            ></div>
                            <div
                                class="absolute top-1/2 left-[25%] -translate-y-1/2 -translate-x-1/2 w-3 h-3 bg-white border-2 border-secondary rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
                            ></div>
                        </div>
                        <!-- Controls -->

                                <button
                                    class="w-10 h-10 rounded-full bg-pastel-blue flex items-center justify-center text-secondary hover:bg-secondary hover:text-white transition-colors"
                                >
                                    <span
                                        class="material-symbols-outlined"
                                        data-icon="play_arrow"
                                        data-weight="fill"
                                        style="
                                            font-variation-settings: &quot;FILL&quot;
                                                1;
                                        "
                                        >play_arrow</span
                                    >
                                </button>
                                <span
                                    class="font-title-lg text-title-lg text-text-heading"

                    >
                        Question 1 of 5
                    </div>
                    <h2
                        class="font-headline-md text-headline-md text-text-heading"
                    >
                        Based on the lecture, why does the professor mention the
                        discovery of the Rosetta Stone?
                    </h2>
                    <form class="flex flex-col gap-4 mt-4">
                        <!-- Option A -->
                        <label
                            class="flex items-center gap-4 p-5 bg-surface-white rounded-xl custom-shadow border border-transparent hover:border-secondary transition-all cursor-pointer group"
                        >
                            <input
                                class="w-5 h-5 text-secondary border-outline-variant focus:ring-secondary focus:ring-offset-0 bg-surface-white cursor-pointer"
                                name="q1"
                                type="radio"
                            />
                            <span
                                class="font-title-lg text-title-lg text-text-heading flex-1 group-hover:text-secondary transition-colors"
                                >A. To illustrate the difficulties of
                                translating ancient languages without a
                                bilingual text.</span
                            >
                        </label>
                        <!-- Option B -->
                        <label
                            class="flex items-center gap-4 p-5 bg-surface-white rounded-xl custom-shadow border border-transparent hover:border-secondary transition-all cursor-pointer group"
                        >
                            <input
                                class="w-5 h-5 text-secondary border-outline-variant focus:ring-secondary focus:ring-offset-0 bg-surface-white cursor-pointer"
                                name="q1"
                                type="radio"
                            />
                            <span
                                class="font-title-lg text-title-lg text-text-heading flex-1 group-hover:text-secondary transition-colors"
                                >B. To emphasize the historical importance of
                                Napoleon's campaign in Egypt.</span
                            >
                        </label>
                        <!-- Option C -->
                        <label
                            class="flex items-center gap-4 p-5 bg-surface-white rounded-xl custom-shadow border border-transparent hover:border-secondary transition-all cursor-pointer group"
                        >
                            <input
                                class="w-5 h-5 text-secondary border-outline-variant focus:ring-secondary focus:ring-offset-0 bg-surface-white cursor-pointer"
                                name="q1"
                                type="radio"
                            />
                            <span
                                class="font-title-lg text-title-lg text-text-heading flex-1 group-hover:text-secondary transition-colors"
                                >C. To contrast the decipherment of Egyptian
                                hieroglyphs with that of Mayan glyphs.</span
                            >
                        </label>
                        <!-- Option D -->
                        <label
                            class="flex items-center gap-4 p-5 bg-surface-white rounded-xl custom-shadow border border-transparent hover:border-secondary transition-all cursor-pointer group"
                        >
                            <input
                                class="w-5 h-5 text-secondary border-outline-variant focus:ring-secondary focus:ring-offset-0 bg-surface-white cursor-pointer"
                                name="q1"
                                type="radio"
                            />
                            <span
                                class="font-title-lg text-title-lg text-text-heading flex-1 group-hover:text-secondary transition-colors"
                                >D. To argue that most ancient artifacts are
                                found by accident rather than through planned
                                excavation.</span

                </div>
                <button
                    class="flex items-center gap-2 bg-primary-container text-white font-label-md text-label-md px-6 py-2 rounded-full hover:bg-primary transition-colors shadow-sm active:scale-95 duration-150"
                >
                    Next

                        class="material-symbols-outlined text-sm"
                        data-icon="chevron_right"
